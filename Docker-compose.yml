version: '3.9'

services:
  postgres:
    image: postgres:16-alpine
    container_name: elenxis-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER:     elenxis
      POSTGRES_PASSWORD: elenxis_dev
      POSTGRES_DB:       elenxis
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U elenxis"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres_data: