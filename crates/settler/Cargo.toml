[package]
name    = "settler"
version = "0.1.0"
edition = "2021"

[dependencies]
tokio        = { version = "1", features = ["full"] }
serde        = { version = "1", features = ["derive"] }
serde_json   = "1"
alloy        = { version = "1", features = ["full"] }
thiserror    = "1"
tracing      = "0.1"
dotenvy      = "0.15"
hex          = "0.4"

[dev-dependencies]
tracing-subscriber = { version = "0.3", features = ["env-filter"] }