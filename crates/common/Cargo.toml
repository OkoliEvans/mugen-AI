[package]
name = "common"
version = "0.1.0"
edition = "2024"

[dependencies]
diesel = { version = "2.2", features = [
    "postgres",
    "uuid",
    "chrono",
    "serde_json",
    "r2d2",
] }
diesel_migrations = "2.2"
deadpool-diesel = { version = "0.6", features = ["postgres"] }

serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "1", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
thiserror = "1"
tracing = "0.1"
dotenvy = "0.15"
