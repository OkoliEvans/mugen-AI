# crates/prover_manager/Cargo.toml

[package]
name = "prover-manager"
version = "0.1.0"
edition = "2021"

[dependencies]
sp1-sdk = { version = "6.0.0-beta.1", features = ["network", "blocking"] }
tiny-mlp = { path = "../models/tiny_mlp" }
rkyv = { version = "0.7", default-features = false, features = [
    "alloc",
    "size_64",
] }
sha2 = "0.10"
bincode = "1"
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "1", features = ["v4"] }
anyhow = "1"
tracing = "0.1"
thiserror = "1"
tracing-subscriber = "0.3.23"
alloy-primitives = { version = "1", default-features = false, features = [
    "tiny-keccak",
] }
hex = "0.4.3"

[profile.test]
opt-level = 1

