# crates/aggregator-guest/Cargo.toml

[package]
name    = "aggregator-guest"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "aggregator-guest"
path = "src/main.rs"

[dependencies]
# verify feature is REQUIRED for sp1_zkvm::lib::verify::verify_sp1_proof
sp1-zkvm = { version = "6.0.0", features = ["verify"] }
sha2     = { version = "0.10.9", default-features = false, features = ["compress"] }